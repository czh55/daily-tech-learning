<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日技术学习 · AI 增量知识库</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#0f172a;color:#e2e8f0;padding:32px}
  h1{font-size:28px;margin-bottom:8px}
  .sub{color:#94a3b8;margin-bottom:24px}
  .day{margin-bottom:32px}
  .day h2{font-size:18px;color:#38bdf8;margin-bottom:8px}
  .item{display:flex;align-items:baseline;gap:8px;padding:6px 0;font-size:15px}
  .item a.title{color:#e2e8f0;text-decoration:none;flex:1}
  .item a.title:hover{color:#38bdf8}
  .item a.audio{color:#a78bfa;font-size:12px;text-decoration:none;white-space:nowrap}
  .item a.audio:hover{color:#c4b5fd}
  .item a.source{color:#64748b;font-size:12px;text-decoration:none;white-space:nowrap}
  .item a.source:hover{color:#38bdf8}
  footer{color:#475569;font-size:13px;margin-top:48px;text-align:center}
</style>
</head>
<body>
  <h1>📚 每日技术深度总结</h1>
  <p class="sub">AI 自动抓取顶级博主最新文章 → 生成 SVG 复习卡片 + 语音讲解 → 日积月累</p>
  <div id="list">加载中...</div>
  <footer>由 Cursor Automations 每日自动更新</footer>
  <script>
    function viewerUrl(f, source) {
      var u = 'viewer.html?f=' + encodeURIComponent(f.path);
      if (source) u += '&source=' + encodeURIComponent(source);
      return u;
    }
    function audioUrl(f) {
      return 'audio/' + f.path.replace(/\.svg$/i, '.mp3');
    }
    fetch('index.json').then(r=>r.json()).then(days=>{
      document.getElementById('list').innerHTML = days.map(d=>
        '<div class="day"><h2>'+d.date+'</h2>'+
        d.files.map(f=>{
          var src = f.source || '';
          var audio = audioUrl(f);
          return '<div class="item">'+
            '<a class="title" href="'+viewerUrl(f, src)+'">'+f.title+'</a>'+
            ' <a class="audio" href="'+audio+'" title="直接播放 MP3">🎧</a>'+
            (src?' <a class="source" href="'+src+'" target="_blank" rel="noopener">[原文]</a>':'')+
            '</div>';
        }).join('')+
        '</div>'
      ).join('');
    });
  </script>
</body>
</html>
