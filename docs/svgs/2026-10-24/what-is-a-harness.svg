.card .highlight{background:#fff7ed;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#9a3412;border-left:4px solid #fb923c}
.map{background:#fff;border-radius:20px;padding:36px;margin-bottom:32px;box-shadow:0 4px 24px rgba(0,0,0,0.06)}
.diagram{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:20px 0}
.node{background:linear-gradient(135deg,#ffedd5,#fed7aa);border:2px solid #fdba74;border-radius:14px;padding:12px 16px;text-align:center;min-width:100px;font-weight:700;font-size:13px;color:#9a3412}
.node-alt{background:linear-gradient(135deg,#e0f2fe,#bae6fd);border-color:#7dd3fc;color:#0369a1}
.arrow-sym{font-size:16px;color:#94a3b8}
