<h1>每个 AI 工程师都应该知道的 20 个循环设计模式</h1>
<div style="margin-bottom:16px">
  <span class="tag tag-blue">Loop Design Patterns</span>
  <span class="tag tag-green">Loop Engineering</span>
  <span class="tag tag-orange">Agent Harness</span>
  <span class="tag tag-purple">自我进化</span>
</div>
<p class="subtitle">本文解决的核心问题是：当 Prompt 杠杆见顶、单次模型调用无法支撑生产级任务时，AI 工程师应如何系统性地设计「生成→评估→学习→改进」的循环，让 Agent 从脆弱 Demo 走向可自我进化的工业级架构。</p>

<div class="map">
  <h3 style="font-size:20px;color:#1e40af;margin-bottom:12px;text-align:center">20 个模式五类递进关系</h3>
  <div class="diagram">
    <div class="node-orange">质量提升<br/><span style="font-size:12px;font-weight:400">1-5 出库前质检</span></div>
    <span class="arrow-sym">→</span>
    <div class="node-green">记忆循环<br/><span style="font-size:12px;font-weight:400">6-10 从历史学习</span></div>
    <span class="arrow-sym">→</span>
    <div class="node">规划循环<br/><span style="font-size:12px;font-weight:400">11-15 动态调整</span></div>
    <span class="arrow-sym">→</span>
    <div class="node-purple">探索循环<br/><span style="font-size:12px;font-weight:400">16-18 多路径寻优</span></div>
    <span class="arrow-sym">→</span>
    <div class="node-orange">系统优化<br/><span style="font-size:12px;font-weight:400">19-20 元循环</span></div>
  </div>
  <p style="text-align:center;color:#64748b;font-size:15px;margin-top:12px">统一灵魂：行动 → 观察 → 评估 → 调整</p>
</div>

<div class="correction">
  <h3>认知纠偏</h3>
  <p style="color:#92400e;font-size:16px">常见误解：「Agent 才是未来，模型越聪明系统越好」—— Rahul 指出 Agent 只是干活的工人，Loop 才是让工人每天自我进化的机制；顶尖团队早已不再死磕 Prompt，而是在构建更好的循环。</p>
</div>

<div class="card">
  <h3>【概念拆解卡】Agent vs Loop vs 单次调用</h3>
  <p><strong>在讲什么问题：</strong>为什么年薪百万与普通工程师的差距不在 Prompt 措辞，而在循环设计？</p>
  <p><strong>核心机制：</strong>老方法：输入 Prompt → 获得 Response → 结束（临时工干完就走）。新方法：生成 → 批判 → 重写 → 打分 → 重试 → 记忆 → 改进，周而复始直到达标。</p>
  <p><strong>关键理解：</strong>生产级最强 AI 系统全部由 Loop 支撑，而非 Single Model Call；竞争维度已从单次调用转向 Loop Engineering。</p>
  <p><strong>典型场景：</strong>代码纠错、文案质检、长程调研、受监管内容生成——任何「第一次尝试失败后需自主变好」的系统。</p>
  <p><strong>边界说明：</strong>简单问答、一次性短链路 Demo 仍可用单次调用；需持续改进、有质量阈值、可量化评估的任务必须用循环。</p>
  <div class="quote">原文：「Agent 只是一个干活的工人。Loop 才是让这个工人不断改进的机制。」</div>
</div>

<div class="card">
  <h3>【方法/工具卡】质量提升循环（模式 1-5）</h3>
  <p><strong>核心思路：</strong>在输出离开系统前，用独立评估角色把质量推到极限；生成者往往不是评判自己输出的最佳裁判。</p>
  <p><strong>操作步骤：</strong></p>
  <p>1. <strong>生成-批判-重写：</strong>Generator 出初稿 → Critic 挑刺 → Generator 重写，循环至达标（文案、代码、报告）。</p>
  <p>2. <strong>打分-重试：</strong><code>while score &lt; threshold: output = generate(); score = evaluate()</code>，生成者不知正在被考核，Evaluator 掌握标准。</p>
  <p>3. <strong>多重批判者：</strong>正确性 / 风格 / 安全 / 领域四维度独立审核，全部通过才出库（医疗、法律、财务）。</p>
  <p>4. <strong>对抗式批判：</strong>Critic 唯一任务是摧毁答案——「哪些假设不成立？怀疑论者怎么反驳？」</p>
  <p>5. <strong>评审团共识：</strong>五个 Evaluator 联合打分抹平噪声，高共识才推进（容错率极低场景）。</p>
  <div class="pitfall">避坑：用一个模型既生成又自评——角色隔离才是精髓；单裁判打分伴随噪声，关键场景需 Ensemble。</div>
</div>

<div class="card">
  <h3>【跨概念对比表】五类循环核心差异</h3>
  <table>
    <tr><th>对比维度</th><th>质量提升 (1-5)</th><th>记忆循环 (6-10)</th><th>规划循环 (11-15)</th><th>探索循环 (16-18)</th><th>系统优化 (19-20)</th></tr>
    <tr><td>核心目的</td><td>出库前质量极限</td><td>从历史学习变聪明</td><td>现实变化时动态调路线</td><td>多路径榨出最优解</td><td>循环本身自我优化</td></tr>
    <tr><td>代表模式</td><td>生成-批判-重写</td><td>Reflexion 反思</td><td>Plan-Execute-Replan</td><td>Branch-and-Explore</td><td>Prompt 自动优化</td></tr>
    <tr><td>关键产出</td><td>达标输出</td><td>错题本/成功模式库</td><td>收敛的螺旋规划</td><td>最优分支</td><td>进化后的 Prompt/工作流</td></tr>
    <tr><td>适用上限</td><td>质量可量化评估时</td><td>任务可重复、有历史</td><td>长周期、强依赖步骤</td><td>算力充足、需深度推理</td><td>有测试集与可测指标</td></tr>
    <tr><td>一句话结论</td><td>分离生成与评判</td><td>失败只摔一次</td><td>规划不是圣旨</td><td>别押注单一路径</td><td>用循环优化循环</td></tr>
  </table>
</div>

<div class="card">
  <h3>【决策/选型表】何时启用哪类循环</h3>
  <table>
    <tr><th>场景</th><th>推荐方案</th><th>核心理由</th><th>不推荐</th><th>为什么不行</th></tr>
    <tr><td>文案/代码需反复打磨</td><td>生成-批判-重写 (#1)</td><td>两角色流水线，Critic 总能找到盲点</td><td>单次生成 + 人工返工</td><td>无法自动化质量收敛</td></tr>
    <tr><td>质量可客观量化</td><td>打分-重试 (#2)</td><td>极度简单却常被低估</td><td>主观感觉「差不多」</td><td>无阈值则无法自动停止</td></tr>
    <tr><td>Agent 反复在同一处失败</td><td>Reflexion + 错误档案库 (#6+#8)</td><td>教训写入 Context 重试；新任务前检索错题本</td><td>每次从零开始</td><td>系统不会比第一次更聪明</td></tr>
    <tr><td>外部环境动态变化</td><td>Plan-Execute-Replan (#11)</td><td>螺旋收敛而非瀑布圣旨</td><td>固定 Pipeline 步骤 1→2→3</td><td>碰撞现实后规划碎落一地</td></tr>
    <tr><td>架构/文案多方案比选</td><td>分支探索 (#16)</td><td>保守/激进/创意并行生成后选最优</td><td>单路径生成</td><td>错过更优解</td></tr>
    <tr><td>延迟/成本/质量三角博弈</td><td>工作流自我重构 (#20)</td><td>自动并行化、换廉价模型、插 Critic 拦截</td><td>人工调参 Prompt</td><td>无法随运行数据持续进化</td></tr>
  </table>
</div>

<div class="card">
  <h3>【避坑清单卡】记忆与规划类常见失效</h3>
  <p><strong>坑名：</strong>只记失败不记成功，或记忆无限膨胀成垃圾。</p>
  <p><strong>原因：</strong>忽略 Success Pattern Loop (#9)；原始记忆未压缩 (#10)。</p>
  <div class="quote">原文：「无限的、杂乱的原始记忆，等同于无法使用的垃圾。」压缩后应升华为抽象规律：「X 会直接导致失败，执行前务必优先检查 X。」</div>
  <p><strong>解法：</strong>每 N 条记忆触发压缩；任务结束固化「决策-结果-若重来」三件套 (#7)。</p>
  <p><strong>严重程度：</strong>小心——第 6 个月表现应与第 1 个月天壤之别，否则记忆层未生效。</p>
  <div class="pitfall"><strong>规划陷阱：</strong>把最初规划当一成不变的圣旨；约束满足循环 (#15) 要求所有硬性约束（预算、延迟、无幻觉）全通过才算完工，一条 business rule 未过则内部不算完成。</div>
</div>

<div class="card">
  <h3>【心法/原则卡】统一公式与范式转移</h3>
  <p><strong>原则：</strong>行动 → 观察 → 评估 → 调整——第一枪产出永远是粗糙起点，Loop 是唯一熔炉。</p>
  <p><strong>为什么重要：</strong>过去式 Prompt→Response（一锤子买卖）；进行时 Generate→Evaluate→Learn→Improve（无限进化）。</p>
  <div class="quote">原文：「去构建循环吧，让它在你睡觉时，替你改变世界。」</div>
  <p><strong>怎么落地：</strong>从模式 #1 生成-批判-重写入手；为可量化场景加 #2 打分-重试；长程任务叠加 #6 Reflexion + #11 重规划；成熟后引入 #20 工作流自我重构。</p>
  <p><strong>适用边界：</strong>树搜索 (#17) 算力消耗极高，仅用于复杂推理链与代码库级 Debug；Prompt 自动优化 (#19) 需有测试集与 evaluate 函数。</p>
</div>

<div class="rebuttal">
  <h3>反驳</h3>
  <p class="rebuttal-role">对立视角：「极简 Prompt 派」/ 快速 MVP 倡导者</p>
  <p class="rebuttal-text">二十种循环是过度设计——多数产品一周上线、用户只在乎功能有没有，为工业级 Agent 设计的五层循环会把简单任务拖成运维噩梦，算力与延迟成本远超收益。</p>
</div>

<div class="conclusion">
  <h2>结论</h2>
  <p><strong>总结：</strong></p>
  <ol>
    <li>Agent 是工人，Loop 是进化机制——顶尖团队构建的是循环，不是更好的 Prompt。</li>
    <li>20 个模式分五类：质量提升、记忆、规划、探索、系统优化，共享「行动→观察→评估→调整」公式。</li>
    <li>最基础也最重要的是生成-批判-重写；记忆循环让系统「只摔一次」；规划循环拒绝把计划当圣旨。</li>
    <li>探索循环通过多路径寻优；系统优化循环实现「用循环优化循环」的元能力。</li>
    <li>单点突破的运气永远敌不过系统级闭环的确定性——架构图里充满自我诊断飞轮才算掌握 AI 系统工程心法。</li>
  </ol>
  <p style="margin-top:20px"><strong>行动清单：</strong></p>
  <ol>
    <li>为当前 Agent 项目选一个最痛的质量瓶颈，实现生成-批判-重写最小闭环（模式 #1）。</li>
    <li>若质量可量化，加上 while score &lt; threshold 的打分-重试循环（模式 #2），生成者与评估者角色隔离。</li>
    <li>建立错误档案库：每次失败写入检索库，新任务启动前先查类似失败记录（模式 #8）。</li>
    <li>长程任务用 Plan-Execute-Replan 替代固定 Pipeline，每 N 步做进度自评（模式 #11+#14）。</li>
    <li>有测试集后启动 Prompt 自动优化循环，让最强 Prompt 由系统繁衍而非人工手写（模式 #19）。</li>
  </ol>
  <p style="margin-top:20px"><strong>关键认知转变：</strong>从「提示词工程师」进化为「循环设计师」——不再祈祷模型一次吐出完美答案，而是构建能在失败中反思、在记忆中学习、在约束中收敛的熔炉；Prompt 是你写完就忘的东西，Loop 才是睡觉时仍在工作的系统。</p>
</div>

