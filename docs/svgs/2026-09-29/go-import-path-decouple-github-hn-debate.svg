.subtitle{font-size:17px;color:#64748b;margin-bottom:32px;line-height:1.6}</style>
      
<h1>Go import 路径：身份、拉取地址与平台解耦</h1>
<div style="margin-bottom:16px">
  <span class="tag tag-blue">Go Modules</span>
  <span class="tag tag-green">Vanity URL</span>
  <span class="tag tag-orange">供应链</span>
  <span class="tag tag-purple">HN 辩论</span>
</div>
<p class="subtitle">本文解决的核心问题是：把 import 写死成 github.com 究竟是习惯还是技术债——作者摊开 HN 正反论据，说明路径同时承担模块身份与物理拉取地址，全局替换救不了不可变 tag，replace 只能止血；并给出 go-import 机制、三类 vanity 落地与存量迁移步骤。</p>

<div class="map">
  <h3 style="font-size:20px;color:#0369a1;margin-bottom:12px;text-align:center">import path 的三重角色</h3>
  <div class="diagram">
    <div class="node">模块身份<br/>Identity</div>
    <span class="arrow-sym">=</span>
    <div class="node-orange">拉取位置<br/>Location</div>
    <span class="arrow-sym">+</span>
    <div class="node-green">校验键<br/>Checksum 链</div>
    <span class="arrow-sym">→</span>
    <div class="node">自有域名<br/>间接层</div>
  </div>
</div>

<div class="correction">
  <h3>认知纠偏</h3>
  <p style="color:#92400e;font-size:16px">常见误解：「迁路径就是全局查找替换，Agent 几小时搞定」。原文强调<strong>不可变 Git tag 仍携带旧路径</strong>，会破坏 bisect 与历史构建，规模上去替换次数按依赖图爆炸。</p>
</div>

<div class="card">
  <h3>【概念拆解卡】import path 的双重属性</h3>
  <p><strong>在讲什么问题：</strong>同一字符串既是命名空间又是仓库 URL，把易变基础设施焊进源码。</p>
  <p><strong>核心机制：</strong>Go 以目录为包，工具链鼓励在源码里写完整托管地址；modules 下该字符串还驱动 go get 与校验。</p>
  <p><strong>关键理解：</strong>争论起点不是「GitHub 好不好」，而是<strong>名字与地址是否应分离</strong>。</p>
  <p><strong>典型场景：</strong>企业同时使用 GitLab、GitHub、Azure DevOps，只因迁移成本太高而三平台并存付费。</p>
  <p><strong>边界说明：</strong>个人练手、一次性脚本不必折腾 vanity；被他人长期依赖的库与企业内库应尽早分离。</p>
  <div class="quote">「同一个字符串，既是名字，又是地址。」——争论的共同起点。</div>
</div>

<div class="card">
  <h3>【跨概念对比表】全局替换 vs replace vs vanity 域名</h3>
  <table>
    <tr><th>维度</th><th>全局替换</th><th>go.mod replace</th><th>自有 vanity 域名</th><th>结论</th></tr>
    <tr><td>历史 tag</td><td>不自动修复，需重打 tag</td><td>不改 tag 内容</td><td>改映射即可，import 不变</td><td>只有 vanity 保护下游 import 字面量</td></tr>
    <tr><td>库作者下游</td><td>需全员跟进</td><td>replace 不传递给依赖方</td><td>下游无感换托管</td><td>库必须用 vanity 或改模块路径</td></tr>
    <tr><td>源码字面量</td><td>可更新</td><td>仍留旧 URL</td><td>稳定为 go.corp/…</td><td>replace 是止血不是架构</td></tr>
    <tr><td>供应链控制面</td><td>无</td><td>无统一入口</td><td>可指向 GOPROXY/制品库</td><td>域名是间接层期权</td></tr>
  </table>
</div>

<div class="card">
  <h3>【方法/工具卡】go-import 最小落地</h3>
  <p><strong>核心思路：</strong>对 <code>?go-get=1</code> 返回带 go-import meta 的 HTML，第三段指向真实 Git 仓库。</p>
  <p><strong>操作步骤：</strong>① 准备域名与 TLS；② 部署返回 meta 的页面（Nginx 或托管 gvu）；③ 人类访问用 <strong>302</strong> 跳仓库（避免 301 被浏览器永久缓存）；④ 配置 go-source 供文档站；⑤ 私有模块设 <code>GOPRIVATE=go.yourcompany.com</code>。</p>
  <p><strong>选型条件：</strong>模块少可用静态 HTML；数量多要通配路由与 /v2 支持；不想运维可选 gvu 类托管 CLI。</p>
  <p><strong>避坑：</strong>vanity 只解析「去哪拉」，<strong>鉴权仍在 Git 服务器</strong>，服务不应保存仓库密码。</p>
</div>

<div class="card">
  <h3>【决策/选型表】何时用 github.com，何时用自有域名</h3>
  <table>
    <tr><th>场景</th><th>推荐</th><th>理由</th><th>不推荐</th><th>为什么不行</th></tr>
    <tr><td>个人练手/一次性工具</td><td>直接用 github.com</td><td>迁移概率低、成本最低</td><td>第 0 天买企业域名流程</td><td>运维大于收益</td></tr>
    <tr><td>长期维护的开源库</td><td>第 0 天 vanity</td><td>依赖方多、期权成本近零</td><td>等火了再迁</td><td>历史 tag 与下游协调爆炸</td></tr>
    <tr><td>企业多团队内库</td><td>vanity + 自建 GOPROXY</td><td>统一缓存、鉴权、校验</td><td>仅靠公共代理</td><td>私有与合规无法满足</td></tr>
    <tr><td>存量 github 路径</td><td>新模块用域名、旧模块渐进</td><td>旧 tag 不能原地改名</td><td>删旧仓库</td><td>破坏未升级依赖方</td></tr>
  </table>
</div>

<div class="card">
  <h3>【避坑清单卡】迁移与静态 vanity</h3>
  <p><strong>旧 tag 陷阱：</strong>改主干不等于改已发布版本。原因：tag 不可变。解法：新路径发新版本，旧路径归档只读。严重程度：致命。</p>
  <p><strong>301 跳转：</strong>浏览器永久记住旧目标。原因：Nginx 默认 301。解法：人类跳转用 302。严重程度：小心。</p>
  <p><strong>/v2 遗漏：</strong>主版本≥2 必须带后缀路径。原因：解析服务未配。解法：选型时确认主版本自动支持。严重程度：小心。</p>
  <p><strong>域名续费：</strong>身份解释权在域名。原因：过期可被抢注。解法：企业续费流程；个人权衡维护责任。严重程度：小心。</p>
</div>

<div class="card">
  <h3>【心法/原则卡】第 0 天的便宜期权</h3>
  <p><strong>原则：</strong>解耦成本不对称——今天半小时配置，换明天跨团队不可灰度迁移。</p>
  <p><strong>为什么重要：</strong>反方对「当前仓库替换简单」成立，正方对「历史与依赖图」成立，时间点不同。</p>
  <p><strong>怎么落地：</strong>新项目先定模块路径；存量用 go mod edit -module、批量 sed、go mod tidy、全量 test，旧 go.mod 加 Deprecated 注释。</p>
  <p><strong>适用边界：</strong>域名运维对个人小库是真实成本，需与「被依赖规模」权衡，并非一刀切。</p>
</div>

<div class="rebuttal">
  <h3>反驳</h3>
  <p class="rebuttal-role">对立视角：「GitHub 足够稳」实用派</p>
  <p class="rebuttal-text">对多数个人库，多一个域名和 vanity 运维点，比平台迁移的极低概率更实在——续费疏忽一次，整条 import 命名空间就交给陌生人。</p>
</div>

<div class="conclusion">
  <h2>结论</h2>
  <p><strong>总结：</strong></p>
  <ol>
    <li>import path 同时是身份、拉取地址与校验键，耦合托管平台是架构层面的绑定。</li>
    <li>全局替换忽略不可变 tag；replace 仅主模块止血，库作者无法替下游承担。</li>
    <li>自有域名是用可控运维换不可控迁移，并可选作 GOPROXY 与供应链入口。</li>
    <li>go-import/go-source + 302 是人类与工具链协作的最小机制。</li>
    <li>争论本质是「第 0 天付半小时」还是「第 N 天付跨团队账单」。 </li>
  </ol>
  <p><strong>行动清单：</strong></p>
  <ol>
    <li>盘点对外模块：被依赖且生命周期&gt;1 年的，评估 vanity 域名。</li>
    <li>新项目在写第一行 import 前确定模块路径，避免事后改 tag 链。</li>
    <li>若迁移存量：归档旧仓库、Deprecated 注释、禁止删除旧路径。</li>
    <li>团队场景检查 /v2、monorepo 子目录（Go 1.25+）是否在解析层支持。</li>
    <li>配置 GOPRIVATE 与自建代理，不把「明天还在」当假设。</li>
  </ol>
  <p><strong>关键认知转变：</strong>从「迁路径就是替换字符串」到「路径是依赖图上的长期合约，越早用间接层，托管商可换而合约不变」。</p>
</div>

    </div>
  </foreignObject>
</svg>