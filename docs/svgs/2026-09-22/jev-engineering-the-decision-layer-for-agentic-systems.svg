<h1>JEV 工程学：智能体系统的决策层</h1>
<div style="margin-bottom:16px">
  <span class="tag tag-purple">Agent 架构</span>
  <span class="tag tag-blue">TypeSafe Jev</span>
  <span class="tag tag-green">Choice/Score/Noul</span>
  <span class="tag tag-orange">置信度门控</span>
</div>
<p class="subtitle">本文解决的核心问题是：把「写作、路由、评估、执行」全塞进一次 LLM 补全会导致慢、贵、不可调试；Jev 工程学主张三层解耦——大模型生成、Jev 做有界类型化决策、代码执行与验证——用 Choice/Score/Noul 契约、并行提问与置信度门槛，把分叉从散文解析里解放出来。</p>

<div class="map">
  <h3 style="font-size:20px;color:#4338ca;margin-bottom:12px;text-align:center">观察 → 决策 → 门控 → 执行 → 验证</h3>
  <div class="diagram">
    <div class="node-green">State<br/>证据快照</div>
    <span class="arrow-sym">→</span>
    <div class="node">Jev<br/>类型化答案</div>
    <span class="arrow-sym">→</span>
    <div class="node-orange">Code<br/>阈值/权限</div>
    <span class="arrow-sym">→</span>
    <div class="node-blue">Act<br/>单步动作</div>
    <span class="arrow-sym">→</span>
    <div class="node-green">Verify<br/>读真实世界</div>
  </div>
</div>

<div class="correction">
  <h3>认知纠偏</h3>
  <p style="color:#92400e;font-size:16px">常见误解：「Jev 要取代大模型」。文中强调<strong>互补</strong>——创意写作、长文调研仍用 LLM；Jev 只接管<strong>答案空间有界、高频重复、输出直接进代码</strong>的分叉，且高置信≠事实正确。</p>
</div>

<div class="card">
  <h3>【概念拆解卡】三层权责与 System One 三原语</h3>
  <p><strong>在讲什么问题：</strong>单一 LLM 包办决策与生成时，故障无法归因到「写错了」还是「选错了」。</p>
  <p><strong>核心机制：</strong>LLM writes / Jev decides / Code acts；Jev 吃结构化 state + 原子问题，返回答案对象（非段落）。</p>
  <p><strong>三原语：</strong>Choice（单选+分布+置信度）、Score（标尺+置信度）、Noul（是/否概率 0–1）。</p>
  <p><strong>状态设计：</strong>goal / evidence / rules / available_actions / previous_actions——传证据不传散文；每步外部动作后<strong>重建 state</strong>。</p>
  <p><strong>边界：</strong>数学日期计算、开放式创作、巨型脏 state 仍不适合 Jev；提示词注入对类型化输出仍有效。</p>
  <div class="quote">问题即契约：准则写可观测情境（如「动笔前需查外部证据」），勿用选项标签复读当准则。</div>
</div>

<div class="card">
  <h3>【方法/工具卡】七法则 + 决策闭环落地</h3>
  <p><strong>操作链路：</strong>Observe → Decide → Gate → Execute → Verify → Repeat；Jev 只选分叉，<strong>永不直接调工具</strong>。</p>
  <p><strong>法则要点：</strong>① 传证据 ② 问题契约 ③ 每步重建选项 ④ 同 state 多问题一次调用（文中 GDPR 例：快 10×、省 12×）⑤ 按置信度门控 ⑥ 权限/预算在代码 ⑦ 按<strong>整任务</strong>算成本。</p>
  <p><strong>置信度起步线：</strong>内部打标 0.70；Agent 交接 0.80；浏览器/工具 0.90；发布/支付/删除 → 确定性检查 + 人工。</p>
  <p><strong>接入：</strong>Path A 原生 Jev API；Path B System One Adapter（OpenAI/Anthropic 垫片，概率校准不可互换，上线需重标阈值）。</p>
  <div class="highlight"><strong>立刻可做：</strong>把现有「让 LLM 输出 JSON 路由」改成 state schema + 1 个 Choice + 代码 gate；同一 state 下把紧急/欺诈/审批拆成并行 Noul。</div>
</div>

<div class="card">
  <h3>【避坑清单卡】五大反模式</h3>
  <p><strong>Prompt-as-State：</strong> state 里塞自然语言指令 → 改显式字段。严重程度：小心。</p>
  <p><strong>Choice-as-Multi-Label：</strong> 多条件可同时成立却强行单选 → 多个独立 Noul + 代码合并。严重程度：致命（路由错）。</p>
  <p><strong>DONE Without Proof：</strong> 模型说完成就停 → 必须读文件/DB/页面做验收。严重程度：<strong>致命</strong>（Demo vs 生产的分水岭）。</p>
  <p><strong>Stale Action Menu：</strong> 环境变了菜单未更新 → 每次决策前重算可用动作。严重程度：致命。</p>
  <p><strong>Confidence-as-Truth：</strong> 高置信当真理 → 标定集定阈值 + Abstain + 高危人工。严重程度：致命。</p>
</div>

<div class="card">
  <h3>【决策/选型表】何时用 Jev / LLM / 纯代码</h3>
  <table>
    <tr><th>场景</th><th>推荐</th><th>核心理由</th><th>不推荐</th><th>为什么</th></tr>
    <tr><td>邮件路由、技能挂载、浏览器点选</td><td>Jev Choice/Noul</td><td>候选有限、高频、进代码分支</td><td>长链 CoT 单 prompt</td><td>解析脆弱、贵且慢</td></tr>
    <tr><td>写回复草稿、论文摘要</td><td>通用 LLM</td><td>需要可读散文与创意</td><td>Jev</td><td>非决策接口</td></tr>
    <tr><td>时间戳加减、权限 bitmask</td><td>确定性代码</td><td>可证明正确</td><td>Jev/LLM</td><td>手册明确归代码</td></tr>
    <tr><td>质量 linter 全量筛</td><td>Jev 并行 Noul + 边界 case 上大模型</td><td>Every 测：777 判 0.7s；漏 1/7 缺陷需二段</td><td>全篇 High-reasoning LLM</td><td>慢 25×、贵 580×</td></tr>
    <tr><td>DOM 巨页逐节点 Score</td><td>先瘦候选再决策</td><td>Retriever 反例：决策便宜但前置膨胀致总成本 +38~51%</td><td>无脑扩大 state</td><td>端到端任务成本才诚实</td></tr>
  </table>
</div>

<div class="card">
  <h3>【跨概念对比表】Jev System One vs 通用 LLM 调用</h3>
  <table>
    <tr><th>维度</th><th>Jev</th><th>通用 LLM</th><th>一句话</th></tr>
    <tr><td>输入</td><td>结构化 state + 类型问题</td><td>自由 prompt</td><td>契约 vs 散文</td></tr>
    <tr><td>输出</td><td>概率/置信度对象</td><td>长文本</td><td>零解析 vs 正则/JSON 提取地狱</td></tr>
    <tr><td>并行</td><td>同 call 多问题（同 state）</td><td>通常一问一 call</td><td>决策密度决定 ROI</td></tr>
    <tr><td>调试</td><td>看分布与阈值</td><td>重读生成文</td><td>分叉可审计</td></tr>
    <tr><td>计费</td><td>按决策次数</td><td>按 token</td><td>高频小判 Jev 占优</td></tr>
  </table>
</div>

<div class="card">
  <h3>【心法/原则卡】决策密度与 Harness 解耦</h3>
  <p><strong>原则：</strong>当单次决策边际成本→0，系统可在每条消息、每次工具调用、每次 handoff 都做判定——价值随频次复合增长。</p>
  <p><strong>数据锚点：</strong>Browser Use 调用 1092→101；500 封邮件 ~3.5¢；1,018 篇论文分类 ~0.08$（不含摘要 LLM）。</p>
  <p><strong>与 Google Harness Thesis：</strong> Jev 把 Harness 里最乱的「决策块」抽成显式类型接口，接口规范比底层权重更持久。</p>
  <p><strong>无人值守纪律：</strong>可逆步骤可自治；红线挂起；恢复先读<strong>最后一次外部确认成功</strong>的状态；置信度不能证明付款/发信已成功。</p>
  <p><strong>适用边界：</strong>基准来自公开 demo，阈值是冷启动线；Adapter ≠ 生产概率校准；闭源 Jev 需自有标定集。</p>
</div>

<div class="rebuttal">
  <h3>反驳</h3>
  <p class="rebuttal-role">对立视角：「一个强推理模型 + 结构化输出就够了」派</p>
  <p class="rebuttal-text">把路由塞进长思考仍按 token 付费、仍靠解析 JSON，并行 13 问要串 13 次时延迟与账单不会 magically 消失——专用决策层卖的是有界分叉的工程接口，不是再包装一次 chat completion。</p>
</div>

<div class="conclusion">
  <h2>结论</h2>
  <p><strong>总结：</strong></p>
  <ol>
    <li>三层解耦 + Choice/Score/Noul 消灭「决策输出解析」类故障。</li>
    <li>State 是证据、问题是契约；同 state 批量提问是性能杠杆。</li>
    <li>代码门控权限与阈值；高危必须人工 + 确定性规则。</li>
    <li>完工与成功以<strong>外部状态探针</strong>为准，不信模型 DONE。</li>
    <li>方法论可脱离单一产品：类型契约 + 置信度 + 验证闭环即核心。</li>
  </ol>
  <p><strong>行动清单：</strong></p>
  <ol>
    <li>选一个高频路由（邮件/技能/模型选择），画 state schema 与 2–4 个原子问题。</li>
    <li>用标注集标定置信度阈值并保留 Abstain/人工分支。</li>
    <li>把「LLM 返回 JSON 分支」迁移为 gate 在代码、决策在 Jev/Adapter。</li>
    <li>为 Agent 循环加 Verify 步骤：每步只执行一个可逆动作并重读 state。</li>
    <li>用<strong>端到端单任务成本</strong>评估，避免只看单次 API 标价。</li>
  </ol>
  <p><strong>关键认知转变：</strong>Agent 竞争力 increasingly 来自毫秒级<strong>有界决策吞吐</strong>，而非单次更长的「冥想式」生成。</p>
</div>

    </div>
