.rebuttal h3{color:#9d174d;margin-bottom:12px;font-size:22px;font-weight:700}
.rebuttal-role{font-size:14px;color:#be185d;font-weight:600;margin-bottom:10px}
.rebuttal-text{font-size:17px;line-height:1.8;color:#831843}
.subtitle{font-size:17px;color:#64748b;margin-bottom:32px;line-height:1.6}</style>
      
<h1>LLaMA-Factory LoRA 增量预训练：从语料到 Qwen3-32B 领域基座</h1>
<div style="margin-bottom:16px">
  <span class="tag tag-blue">预训练 PT</span>
  <span class="tag tag-indigo">LLaMA-Factory</span>
  <span class="tag tag-slate">网络安全领域</span>
</div>
<p class="subtitle">本文解决的核心问题是：如何把治理后的领域 chunks、蒸馏问答与分层采样的通用语料（悟道 WuDao）合并成约 926M tokens 的 jsonl，在 LLaMA-Factory 里用 stage=pt + LoRA 做增量预训练，并通过续写与评测集相对变化选出 checkpoint，同时控制灾难性遗忘。</p>

<div class="map">
  <h3 style="font-size:20px;color:#1d4ed8;margin-bottom:12px;text-align:center">四步流水线</h3>
  <div class="diagram">
    <div class="node">数据准备<br/>cyber_pt</div><span class="arrow-sym">→</span>
    <div class="node">注册<br/>dataset_info</div><span class="arrow-sym">→</span>
    <div class="node-alt">train<br/>LoRA PT</div><span class="arrow-sym">→</span>
    <div class="node">merge+评测<br/>选 checkpoint</div>
  </div>
</div>

<div class="correction">
  <h3>认知纠偏</h3>
  <p style="color:#92400e;font-size:16px">误解：预训练评测分数是绝对真理。作者强调预训练评测是方向性的，真正价值要等 SFT 后再评；应看相对变化（基座 vs 合并后），而非单次绝对分。</p>
</div>

<div class="card">
  <h3>【概念拆解卡】增量预训练在学什么</h3>
  <p><strong>在讲什么问题：</strong>领域「教材」注入——下一 token 预测，不关心 QA 格式。</p>
  <p><strong>关键理解：</strong>高质量 Alpaca 问答可拼成自然文本参与 PT；与 SFT 不同，列映射为 prompt←text。</p>
  <p><strong>边界说明：</strong>&lt;1M tokens 不建议 PT，直接 SFT；本文 ~926M tokens 走 LoRA PT 合理区间。</p>
  <p><strong>原文依据：</strong>「模型已经读完了领域教材，但还不知道如何组织成有用回答」——下篇才是 SFT。</p>
</div>

<div class="card">
  <h3>【方法/工具卡】构建 cyber_pt.jsonl</h3>
  <p><strong>操作步骤：</strong>1) chunks_judged keep+text；2) EasyDataset 蒸馏 Alpaca 转问答拼接；3) 合并 wudao_pt 通用分层采样（百科40%等）；4) MD5 去重+坏词过滤。</p>
  <p><strong>落地比例：</strong>通用 60%～70%，领域 30%～40%，缓解灾难性遗忘。</p>
  <p><strong>避坑：</strong>只用领域语料会掉通用问答——必须混合通用分布。</p>
</div>

<div class="card">
  <h3>【决策/选型表】按 token 规模选训练方式</h3>
  <table>
    <tr><th>规模</th><th>推荐</th><th>理由</th><th>不推荐</th><th>为什么不行</th></tr>
    <tr><td>&lt;1M</td><td>跳过 PT，直接 SFT</td><td>数据不足以改变分布</td><td>硬做 PT</td><td>性价比差</td></tr>
    <tr><td>1M～1B</td><td>LoRA 增量 PT</td><td>个人/中小团队可承受</td><td>默认全参</td><td>显存与成本爆炸</td></tr>
    <tr><td>&gt;1B</td><td>全参 PT</td><td>企业级语料</td><td>单卡 LoRA 硬扛</td><td>与目标不匹配</td></tr>
    <tr><td>本文 ~926M</td><td>LoRA rank 8/8</td><td>作者实测路径</td><td>rank 过高</td><td>易伤通用能力</td></tr>
  </table>
</div>

<div class="card">
  <h3>【方法/工具卡】cyber_pt.yaml 关键参数</h3>
  <p><strong>核心配置：</strong>stage: pt；finetuning_type: lora；cutoff_len 4096；lr 5e-5；epochs 20；bf16 + gradient_checkpointing。</p>
  <p><strong>启动：</strong>llamafactory-cli train params/cyber_pt.yaml（Qwen3-32B 约需 1～2×A100/H100）。</p>
  <p><strong>合并：</strong>选 loss 0.5～0.8 区间 checkpoint → export yaml → llamafactory-cli export。</p>
  <div class="highlight">dataset_info 中 columns.prompt 映射 jsonl 的 text 字段——注册错误则训练读空列。</div>
</div>

<div class="card">
  <h3>【避坑清单卡】训练与选型</h3>
  <p><strong>坑名：</strong>领域 loss 降但通用 benchmark 大跌。</p>
  <p><strong>解法：</strong>减 epoch、降 lr、提高通用语料比例。</p>
  <p><strong>坑名：</strong>续写胡言或重复。</p>
  <p><strong>解法：</strong>学习率或轮次过大 → 选更早 checkpoint。</p>
  <p><strong>坑名：</strong>只盯训练后关键词命中率。</p>
  <p><strong>解法：</strong>与未合并基座对比相对提升。</p>
</div>

<div class="card">
  <h3>【方法/工具卡】效果查看双轨</h3>
  <p><strong>文本续写：</strong>30～50 条领域开头，vLLM 部署对比基座与 PT 模型（术语、连贯性）。</p>
  <p><strong>评测集：</strong>通用:领域 1:1 几百条，EvalScope 看相对变化；接口与模板两次一致。</p>
  <p><strong>重训原则：</strong>每次只改 1～2 个变量并记录配置，避免无法归因。</p>
</div>

<div class="card">
  <h3>【心法/原则卡】预训练在全流程中的位置</h3>
  <p><strong>原则：</strong>PT 注入知识，SFT 教「怎么答」——跳过 PT 或跳过评测都会在后面付费。</p>
  <p><strong>怎么落地：</strong>token 统计用基座 tokenizer.json 批处理累加；注册+yaml+export 三件套进 Git。</p>
  <p><strong>适用边界：</strong>32B 级训练是工程战役；小模型可缩小数据与 checkpoint 实验规模。</p>
</div>

<div class="rebuttal">
  <h3>反驳</h3>
  <p class="rebuttal-role">对立视角：「领域 RAG 就够了，不必做 LoRA 预训练」</p>
  <p class="rebuttal-text">RAG 不改模型权重，难内化术语分布与长程连贯；增量 PT 是在参数里「读过教材」，与检索增强解决的是不同层的知识驻留问题。</p>
</div>

<div class="conclusion">
  <h2>结论</h2>
  <p><strong>总结</strong></p>
  <ol>
    <li>领域 chunks + 蒸馏 QA + 分层通用语料 → cyber_pt.jsonl（约 76k 条 / 926M tokens）。</li>
    <li>通用:领域 ≈ 6:4～7:3 是控制遗忘的实用比例。</li>
    <li>LLaMA-Factory stage=pt + LoRA 8/8 完成约 2 天训练并 plot_loss。</li>
    <li>checkpoint 在 loss 0.5～0.8 区间合并，续写+EvalScope 相对评测选型（如 checkpoint-6250）。</li>
    <li>预训练评测是方向性的，SFT 才是对外价值的主战场。</li>
  </ol>
  <p><strong>行动清单</strong></p>
  <ol>
    <li>用 tokenizer 统计现有 jsonl 的 token 数，对照四档规模表选 PT/SFT。</li>
    <li>在 dataset_info.json 注册 cyber_pt 并核对 prompt←text 映射。</li>
    <li>准备 cyber_pt.yaml 与 merge yaml，记录 save_steps 与 export_size。</li>
    <li>vLLM 部署后跑同一 prompt 对比基座与合并模型续写。</li>
    <li>构建 1:1 评测集，用 EvalScope 只看相对指标变化。</li>
  </ol>
  <p><strong>关键认知转变</strong></p>
  <p>从「堆领域数据训练」转为「混合分布 + LoRA 增量 + 相对评测选 checkpoint」——预训练是把知识写进权重，而不是替代 SFT 的终点。</p>
</div>

