<h1>豆包 + Seedance：10 秒 AI 视频的提示词三步法</h1>
<div style="margin-bottom:16px">
  <span class="tag tag-violet">豆包</span>
  <span class="tag tag-fuchsia">Seedance</span>
  <span class="tag tag-sky">提示词工程</span>
  <span class="tag tag-slate">入门试水</span>
</div>
<p class="subtitle">本文解决的核心问题是：不碰即梦/可灵等专业平台，如何用手机豆包免费额度做出第一段约 10 秒电影感镜头——关键是把影视工业里的景别、运镜、光效、画幅写进结构化提示词，并借大模型先搜模板再改写。</p>

<div class="map">
  <h3 style="font-size:20px;color:#6d28d9;margin-bottom:12px;text-align:center">需求描述 → LLM 搜模板/改写 → 豆包视频生成</h3>
  <div class="diagram">
    <div class="node">DeepSeek<br/>找模板</div><span class="arrow-sym">→</span>
    <div class="node">改意象<br/>分镜台词</div><span class="arrow-sym">→</span>
    <div class="node">豆包<br/>seedance fast</div><span class="arrow-sym">→</span>
    <div class="node">5–10min<br/>成片</div>
  </div>
</div>

<div class="correction">
  <h3>认知纠偏</h3>
  <p style="color:#92400e;font-size:16px">误解：「帮我生成古风女子站在桃花树下」就够。那样模型自由发挥，十次十种质量；专业写法要写明运镜、时段光线、构图、胶片质感与氛围词。</p>
</div>

<div class="card">
  <h3>【概念拆解卡】视频提示词 = 虚拟摄制组简报</h3>
  <p><strong>在讲什么问题：</strong>视频生成提示词不是聊天句，而是把选景、布光、机位、画幅、调色浓缩成结构化文本。</p>
  <p><strong>关键理解：</strong>质量差距主要来自提示词密度，而非先选哪款 App。</p>
  <p><strong>典型字段：</strong>人物外观、0–3s/3–6s/6–10s 分镜、台词、音效、整体风格标签。</p>
  <p><strong>边界：</strong>本文是 10 秒试水，不追求完整剧情短片。</p>
  <p><strong>原文依据：</strong>「提示词的质量，直接决定成片的质感。」</p>
</div>

<div class="card">
  <h3>【方法/工具卡】三步走实操</h3>
  <p><strong>第一步：</strong>让 DeepSeek/Kimi 联网检索类似场景的优质提示词模板（含分镜时间轴）。</p>
  <p><strong>第二步：</strong>把意象、人物、台词换成自己的目标（作者示例：萧纲《咏内人昼眠》+ 室内昼眠场景）。</p>
  <p><strong>第三步：</strong>豆包 App → 视频生成 → 模型 <code>seedance fast</code>（预算足可 2.5）、画幅 16:9、时长 10s，粘贴提示词等待 5–10 分钟。</p>
  <div class="highlight">免费用户每日约 10 次生成额度；字节系同样接入 Seedance，与即梦同源能力。</div>
</div>

<div class="card">
  <h3>【跨概念对比表】朴素句 vs 专业结构化提示</h3>
  <table>
    <tr><th>维度</th><th>朴素一句</th><th>专业结构化</th></tr>
    <tr><td>运镜</td><td>未指定</td><td>环绕推近、远景→中景→特写</td></tr>
    <tr><td>光线</td><td>未指定</td><td>黄金时刻侧逆光、丁达尔</td></tr>
    <tr><td>稳定性</td><td>十次十种</td><td>风格标签锁定电影画幅/颗粒</td></tr>
    <tr><td>音频</td><td>无</td><td>雨声、古筝、环境细响</td></tr>
  </table>
</div>

<div class="card">
  <h3>【决策/选型表】豆包 vs 即梦/可灵</h3>
  <table>
    <tr><th>场景</th><th>推荐</th><th>理由</th></tr>
    <tr><td>手机快速试 10–15s 镜头</td><td>豆包</td><td>免安装专业平台、有免费额度</td></tr>
    <tr><td>短剧级连续生产</td><td>即梦等</td><td>与抖音/红果链路更深</td></tr>
    <tr><td>不会写提示词</td><td>先 LLM 模板再豆包</td><td>作者明确建议新手勿硬写</td></tr>
  </table>
</div>

<div class="card">
  <h3>【避坑清单卡】期待与内容尺度</h3>
  <p><strong>坑名：</strong>把豆包当长剧情剪辑器。</p>
  <p><strong>解法：</strong>定位单镜头高质量画面，剧情连续性另上专业流程。</p>
  <p><strong>坑名：</strong>改写提示词时堆砌矛盾风格词。</p>
  <p><strong>解法：</strong>保留分镜结构，只替换人物/场景/台词/音效块。</p>
  <p><strong>坑名：</strong>忽视等待时间与额度。</p>
  <p><strong>解法：</strong>预留 5–10 分钟渲染；规划每日 10 次额度做迭代。</p>
  <p><strong>严重程度：</strong>定位错误为小心；额度耗尽为可预期。</p>
</div>

<div class="card">
  <h3>【心法/原则卡】先模板，后意象</h3>
  <p><strong>原则：</strong>视频提示词能力是可学习的「核心技术」，工具可换，结构化思维不变。</p>
  <p><strong>落地：</strong>搜模板 → 改分镜与台词 → 豆包生成 → 对比迭代形容词与光效词。</p>
  <p><strong>边界：</strong>作者主业仍是大模型研究；此文记录首次视频生成体验，非工业管线白皮书。</p>
</div>

<div class="rebuttal">
  <h3>反驳</h3>
  <p class="rebuttal-role">对立视角：「必须上即梦/可灵才够专业」</p>
  <p class="rebuttal-text">同系 Seedance 能力在豆包已可出电影感单镜；拉开差距的是提示词与分镜结构，不是先选最重的平台。</p>
</div>

<div class="conclusion">
  <h2>结论</h2>
  <p><strong>总结</strong></p>
  <ol>
    <li>AI 视频入门门槛已低到「会说话 + 会改模板」。</li>
    <li>结构化提示词决定质感，运镜/光线/画幅/音效要写明。</li>
    <li>LLM 先搜再改，比新手硬写更稳。</li>
    <li>豆包适合 10 秒级试水；短剧量产仍倾向即梦等。</li>
    <li>提示词工程本身是最值得持续投入的能力。</li>
  </ol>
  <p><strong>行动清单</strong></p>
  <ol>
    <li>用 DeepSeek 搜一条同题材视频提示词模板。</li>
    <li>按 0–3/3–6/6–10 秒改写人物、场景、台词、音效。</li>
    <li>豆包选 seedance fast、16:9、10s 生成并保存成片。</li>
    <li>对比朴素一句与结构化版本的差异做笔记。</li>
    <li>额度内做 2–3 轮光效/运镜微调练手感。</li>
  </ol>
  <p><strong>关键认知转变</strong></p>
  <p>从「选平台决定效果」转为「提示词是虚拟摄制组，平台只是冲印店」。 </p>
</div>

