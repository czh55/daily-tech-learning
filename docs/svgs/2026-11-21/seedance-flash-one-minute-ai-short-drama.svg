.tag{display:inline-block;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;margin-right:8px}
.tag-video{background:#ffedd5;color:#c2410c}.tag-ai{background:#fef3c7;color:#b45309}.tag-workflow{background:#fce7f3;color:#9d174d}
