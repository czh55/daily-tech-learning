.subtitle{font-size:17px;color:#64748b;margin-bottom:32px;line-height:1.6}</style>
      
<h1>AI 软件工厂 1.0：Secure Software Factory 架构</h1>
<div style="margin-bottom:16px">
  <span class="tag tag-violet">Agent Baseline</span>
  <span class="tag tag-purple">安全边界</span>
  <span class="tag tag-slate">Go 落地</span>
</div>
<p class="subtitle">本文解决的核心问题是：当 Agent 能自主改码、测、部署时，如何用四道可强制执行的安全边界与三级成熟度模型，把「更聪明的模型」升级为可审计、可渐进建设的软件工厂，而不是扩大权限的超级脚本。</p>

<div class="map">
  <h3 style="font-size:20px;color:#5b21b6;margin-bottom:12px;text-align:center">四道边界 + 编排/观测</h3>
  <div class="diagram">
    <div class="node">Sandbox</div><span class="arrow-sym">→</span>
    <div class="node">Network</div><span class="arrow-sym">→</span>
    <div class="node">Supply Chain</div><span class="arrow-sym">→</span>
    <div class="node">Identity</div>
  </div>
  <p style="text-align:center;font-size:14px;color:#64748b;margin-top:12px">外加：受控执行入口 · 不可篡改审计</p>
</div>

<div class="correction">
  <h3>认知纠偏</h3>
  <p style="color:#92400e;font-size:16px">误解：软件工厂=更强的 Coding Agent。白皮书强调它是接收任务→生产→验证→反馈的<strong>系统</strong>；Vercel/Uber 等案例数字是引用数据，不能当作每家企业的默认产能。</p>
</div>

<div class="card">
  <h3>【概念拆解卡】决策与授权分离</h3>
  <p><strong>在讲什么问题：</strong>Agent 能「决定」做什么，为何不能同时「有权」做什么？</p>
  <p><strong>关键理解：</strong>提示词里的「只用测试环境」在能读到生产 Token 时只是建议；PocketOS 九秒删库说明权限必须外部强制执行。</p>
  <p><strong>典型场景：</strong>告警→隔离沙箱分析→改码测→PR→策略审批→部署→观测回滚。</p>
  <p><strong>边界说明：</strong>适用于 Agent 可触达内网/云 API 的企业；纯本地 Copilot 仍需部分原则但强度不同。</p>
  <p><strong>原文依据：</strong>「Agent 负责提出行动方案，策略系统负责授权，外部基础设施负责强制执行。」</p>
</div>

<div class="card">
  <h3>【方法/工具卡】四道边界落地要点</h3>
  <p><strong>Sandbox：</strong>每任务独立可销毁环境；禁 docker.sock；非特权；仅挂载所需仓库——「进容器」≠安全。</p>
  <p><strong>Network：</strong>沙箱外出口代理、默认拒绝；细到「支付服务过去一小时日志」而非全网通。</p>
  <p><strong>Supply Chain：</strong>批准镜像/Harness/Skill；制品库+完整性；Agent 不能绕过镜像直拉公网。</p>
  <p><strong>Identity：</strong>每 Agent 独立身份、短生命周期凭据；操作关联任务与请求者。</p>
  <p><strong>怎么落地：</strong>从最小闭环（单仓库 PR Agent + 沙箱 + 审计）扩展，而非一次买齐四产品。</p>
</div>

<div class="card">
  <h3>【跨概念对比表】三道边界常见误配</h3>
  <table>
    <tr><th>维度</th><th>表面做法</th><th>白皮书要求</th><th>结论</th></tr>
    <tr><td>隔离</td><td>Agent 跑在 Docker</td><td>不可改隔离、无 sock、任务级销毁</td><td>容器≠沙箱</td></tr>
    <tr><td>网络</td><td>设 HTTP_PROXY 环境变量</td><td>沙箱外强制 egress 策略</td><td>Agent 可绕过 env</td></tr>
    <tr><td>依赖</td><td>口头要求用内网镜像</td><td>物理上无法直连公网源</td><td>策略要可执行</td></tr>
  </table>
</div>

<div class="card">
  <h3>【决策/选型表】三级成熟度怎么选</h3>
  <table>
    <tr><th>场景</th><th>推荐层级</th><th>核心理由</th><th>不推荐</th><th>为什么不行</th></tr>
    <tr><td>首次试点 Agent 改 PR</td><td>Level 1 人工编排</td><td>人批准每步，风险可控</td><td>直接 Level 3</td><td>无审计与边界会复现 PocketOS 类事件</td></tr>
    <tr><td>固定工单流水线</td><td>Level 2 工作流编排</td><td>步骤可重复、策略嵌入</td><td>完全自由 Agent</td><td>路径不可预测</td></tr>
    <tr><td>边界+观测已成熟</td><td>Level 3 Agent 编排</td><td>自主领任务但在策略内</td><td>跳过 L1/L2</td><td>缺证据链与回滚习惯</td></tr>
  </table>
</div>

<div class="card">
  <h3>【心法/原则卡】凭据不交给 Agent</h3>
  <p><strong>原则：</strong>Agent 提请求，授权服务判定，代理代为访问——模型不持有长期超级 Token。</p>
  <p><strong>为什么重要：</strong>恶意提示词或错误推理在凭据在手时等于即时越权。</p>
  <p><strong>怎么落地：</strong>Go 栈用受控入口启动 Agent；代码里用策略引擎表达「能否 merge/deploy」。</p>
  <p><strong>适用边界：</strong>仍需人工 break-glass 与合规保留策略例外流程。</p>
</div>

<div class="card">
  <h3>【避坑清单卡】软件工厂建设陷阱</h3>
  <p><strong>坑名：</strong>把网络可达性当成应用层授权。</p>
  <p><strong>原因：</strong>Tailscale 等只解决「能否连上」，不替代 API scope。</p>
  <p><strong>解法：</strong>网络策略 + OAuth scope + 审计三元同时设计。</p>
  <p><strong>严重程度：</strong>致命——误配等于给 Agent 内网地图。</p>
</div>

<div class="rebuttal">
  <h3>反驳</h3>
  <p class="rebuttal-role">对立视角：「现有 IAM + K8s NetworkPolicy 已经够用，不必新造软件工厂概念」</p>
  <p class="rebuttal-text">传统 IAM 约束的是预编程序；Agent 在运行时发明路径，需要任务级沙箱、动态供应链与按次授权——白皮书是把已有控件重排成 Agent 时代的生产流水线，不是否定 K8s。</p>
</div>

<div class="conclusion">
  <h2>结论</h2>
  <p><strong>总结</strong></p>
  <ol>
    <li>下一站是软件工厂系统，不是单点更聪明模型。</li>
    <li>四边界（沙箱/网络/供应链/身份）必须可强制执行，不能靠提示词。</li>
    <li>执行编排入口 + 全链路可观测构成安全闭环证据。</li>
    <li>三级成熟度支持从人工编排渐进到 Agent 编排。</li>
    <li>Go 团队可从最小 PR 闭环起步，用代码表达权限边界。</li>
  </ol>
  <p><strong>行动清单</strong></p>
  <ol>
    <li>阅读 Agent Baseline《The Secure Software Factory》1.0 草案原文。</li>
    <li>绘制本组织 Agent 当前能触达的凭据与网络路径（红队视角）。</li>
    <li>为一次 Agent 任务定义独立沙箱 profile（无 docker.sock）。</li>
    <li>建立「每次运行必留审计」的最小字段集（谁、何任务、何操作）。</li>
    <li>选 Level 1 试点：告警→沙箱分析→PR，人工批准 merge。</li>
  </ol>
  <p><strong>关键认知转变</strong></p>
  <p>让 Agent 更自主的前提是让基础设施更可靠——自主权应来自策略与边界设计，而非把更多 Token 塞进上下文。</p>
</div>

    </div>
