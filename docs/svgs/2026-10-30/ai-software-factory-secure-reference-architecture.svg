.tag{display:inline-block;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;margin-right:8px}
.tag-violet{background:#ede9fe;color:#5b21b6}.tag-purple{background:#f3e8ff;color:#7e22ce}.tag-slate{background:#f1f5f9;color:#334155}
