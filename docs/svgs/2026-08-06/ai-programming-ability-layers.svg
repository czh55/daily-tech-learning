.subtitle{font-size:17px;color:#64748b;margin-bottom:32px;line-height:1.6}</style>
      
<h1>AI 时代，你的编程能力在第几层？</h1>
<div style="margin-bottom:16px">
  <span class="tag tag-blue">五层能力模型</span>
  <span class="tag tag-orange">验证债</span>
  <span class="tag tag-green">理解债</span>
  <span class="tag tag-purple">工程判断</span>
  <span class="tag tag-red">生产交付</span>
</div>
<p class="subtitle">本文解决的核心问题是：当 42% 代码已 AI 辅助生成而仅 48% 开发者每次都认真 review 时，程序员如何用递进的五层工程判断体系补上「验证债」与「理解债」，把内部后台这类常见需求从 Demo 做到可上线、可迭代、可扛真实用户。</p>

<div class="map">
  <h3 style="font-size:20px;color:#1e40af;margin-bottom:12px;text-align:center">五层递进能力链（上一层不过关，下一层是空中楼阁）</h3>
  <div class="diagram">
    <div class="node">① 显性错误验收<br/>异常路径 · 边界状态</div>
    <span class="arrow-sym">→</span>
    <div class="node">② 需求结构化<br/>规格替代形容词</div>
    <span class="arrow-sym">→</span>
    <div class="node">③ 技术方案取舍<br/>做减法</div>
    <span class="arrow-sym">→</span>
    <div class="node">④ 工程规范架构<br/>表 · 契约 · 日志</div>
    <span class="arrow-sym">→</span>
    <div class="node-green">⑤ 生产化交付<br/>权限 · 审计 · 容灾</div>
  </div>
  <p style="text-align:center;color:#64748b;font-size:15px;margin-top:12px">案例：日均 10 人使用的运营活动后台——口头需求 → AI 生成 → 上线两周的 Bug/返工/故障统计</p>
</div>

<div class="correction">
  <h3>认知纠偏</h3>
  <p style="color:#92400e;font-size:16px">常见误解：瓶颈在「让 AI 写更多代码」。数据指向相反——Sonar 42% AI 代码、48% 认真 review；Veracode 45% AI 代码带漏洞；Anthropic 实验 AI 组理解测试低 17%。缺的是跟 AI 协作的工程判断，不是打字速度。</p>
</div>

<div class="card">
  <h3>【概念拆解卡】五层能力与五种「债」</h3>
  <p><strong>在讲什么问题：</strong>AI 产出速度跑在人理解与验证能力前面；「实习生大军」功能正确高、工程判断零；「沉默行为偏移」测试全过但未测路径行为已变。</p>
  <p><strong>核心机制：</strong>五层递进——①扫 AI 代码坑 ②模糊需求变结构化规格 ③拒绝过度设计 ④表/接口/日志规矩 ⑤权限审计备份告警。</p>
  <p><strong>关键理解：</strong>理解债、验证债、翻译税、实习生大军、沉默偏移指向同一件事；五层能力是这些债逼出来的刚需。</p>
  <p><strong>典型场景：</strong>2 年经验前端用 Cursor 独立做运营后台，口头需求「配活动看数据就行」。</p>
  <p><strong>边界说明：</strong>第五层 AI 不会主动提醒——权限、软删除、备份须人脑先有再写进需求。</p>
  <div class="quote">原文：「AI 改写的是学习方式，不是编程的价值——它吃掉机械编码，放大判断、取舍、架构、风控。」</div>
</div>

<div class="card">
  <h3>【跨概念对比表】只会用 AI vs 五层能力者</h3>
  <table>
    <tr><th>维度</th><th>只会用 AI</th><th>具备五层能力</th><th>案例对照</th></tr>
    <tr><td>拿到需求</td><td>模糊描述直接丢 AI</td><td>先拆结构化规格</td><td>「清晰」→ 列表行+筛选+空态文案</td></tr>
    <tr><td>代码产出后</td><td>正常流程跑通即过</td><td>先测异常路径与边界</td><td>控制台 4 警告、loading 连点、窄屏溢出</td></tr>
    <tr><td>AI 推荐方案</td><td>全盘接受技术栈</td><td>按体量做减法</td><td>拒绝 Redis+K8s，单体+轻量 DB 够用</td></tr>
    <tr><td>协作接手</td><td>字段命名混乱、无日志</td><td>契约与规范先定</td><td>同事改两天改不动</td></tr>
    <tr><td>上线后</td><td>误删无恢复、无审计</td><td>软删除+操作日志+备份</td><td>运营误删活动数据直接丢失</td></tr>
  </table>
</div>

<div class="card">
  <h3>【方法/工具卡】第一层与第二层实操</h3>
  <p><strong>第一层练法：</strong>别先测 happy path——先想 3 个「万一」：接口超时？数据为空？连点两下？再测控制台三色状态（正常/loading/报错）与窄屏布局。</p>
  <p><strong>第二层练法：</strong>把「好看好用」拆成页面结构、组件五态（正常/空/加载/报错/无权限）、交互流程、数据边界；奖品配置示例：两步表单+卡片预览+拖拽排序。</p>
  <p><strong>第三层灵魂三问：</strong>业务真需要还是 AI 肌肉记忆？中间件解决真实还是想象问题？三个月后团队还能维护吗？</p>
  <div class="highlight"><strong>落地建议：</strong>规范定好后 AI 产出可减少 60%+ 规范化问题；senior 被「翻译税」拖慢——省下的编码时间赔在纠正过度设计上。</div>
</div>

<div class="card">
  <h3>【决策/选型表】技术方案减法（第三层）</h3>
  <table>
    <tr><th>场景</th><th>推荐</th><th>理由</th><th>不推荐</th><th>为什么</th></tr>
    <tr><td>日均&lt;10人内部后台</td><td>单体 Node + 轻量 DB</td><td>几万条数据、无高并发</td><td>Redis + K8s 全家桶</td><td>AI 训练数据大厂方案，非你的 3 人维护 reality</td></tr>
    <tr><td>接口设计</td><td>成功/失败统一契约</td><td>团队可接手</td><td>成功 {data,msg} 失败抛 500 堆栈</td><td>协作时直接懵</td></tr>
    <tr><td>删除类操作</td><td>软删除 + 操作审计</td><td>误删可恢复、可追溯</td><td>物理删除无日志</td><td>运营误删活动无法挽回</td></tr>
  </table>
</div>

<div class="card">
  <h3>【避坑清单卡】验证债与沉默偏移</h3>
  <p><strong>坑名：</strong>功能能跑 ≠ 工程能用</p>
  <p><strong>原因：</strong>接口异常、边界状态、兼容性在 Demo 看不出来；AI 不会主动覆盖。</p>
  <p><strong>原文说法：</strong>一半代码 AI 写、一半没人认真审——中间 gap 叫验证债；45% AI 代码引入安全漏洞。</p>
  <p><strong>解法：</strong>把注意力从 happy path 移到异常路径；每次都 review 而非抽样。</p>
  <p><strong>严重程度：</strong>致命——Silent Behavioral Drift 在未测路径悄悄变行为。</p>
  <div class="pitfall"><strong>第四层坑：</strong>一人 AI 写得爽，不规范代码产生速度也更快——技术债比手写时代堆得更快。</div>
</div>

<div class="card">
  <h3>【心法/原则卡】第五层生产 checklist</h3>
  <p><strong>原则：</strong>Demo 与商业产品鸿沟在「真实世界」——权限、审计、备份、告警、灰度回滚须人明确写入需求。</p>
  <p><strong>怎么落地：</strong>① 权限：谁看改删 ② 敏感字段加密、软删除、定期备份 ③ 关键操作日志（谁、何时、变更前后）④ 异常告警 ⑤ 灰度与回滚。</p>
  <p><strong>适用边界：</strong>AI 目标是「做出来」，不会主动考虑这些——这才是从业者护城河。</p>
  <p><strong>为什么重要：</strong>过去拼手速，现在拼判断力；工具是提速，稳定落地靠人。</p>
</div>

<div class="rebuttal">
  <h3>反驳</h3>
  <p class="rebuttal-role">对立视角：AI 编码激进派 · 「交付速度就是竞争力」</p>
  <p class="rebuttal-text">五层 checklist 把内部后台做成合规审计工程，2 年经验的前端面对口头需求若层层规格化、减法审栈，交付周期可能比手写还长——在业务只要求「能配活动」时，过度工程化才是真焦虑来源。</p>
</div>

<div class="conclusion">
  <h2>结论</h2>
  <p><strong>总结：</strong></p>
  <ol>
    <li>五层递进：显性验收 → 需求结构化 → 方案取舍 → 规范架构 → 生产交付；上一层不过关下一层悬空。</li>
    <li>验证债、理解债、翻译税等概念共同指向：AI 产出速度远超人理解与验证能力。</li>
    <li>案例贯穿：运营后台从口头需求到误删无审计，每层卡点具体可复现。</li>
    <li>第三层是分水岭——过了才算掌控 AI，而非 AI 操作员。</li>
    <li>AI 吃体力活、放大判断力；能看出问题的人比只会写代码的人值钱。</li>
  </ol>
  <p><strong>行动清单：</strong></p>
  <ol>
    <li>AI 产出后先测 3 个「万一」与 loading/窄屏，再跑正常流程。</li>
    <li>需求用结构+五态+边界描述，禁用纯形容词。</li>
    <li>AI 推技术栈前问三句灵魂拷问，默认做减法。</li>
    <li>开工前定表结构、接口契约、日志规范。</li>
    <li>上线前逐项确认权限、软删除、备份、告警与回滚。</li>
  </ol>
  <p><strong>关键认知转变：</strong>学习重心从「语法→框架→项目」转向「校验→规格→取舍→规范→交付」；第一层练扎实比跟风新工具更重要。</p>
</div>

    </div>
  </foreignObject>
</svg>