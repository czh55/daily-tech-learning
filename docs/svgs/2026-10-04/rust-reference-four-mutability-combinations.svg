<h1>Rust 引用四种可变性：两层 mut 各管什么</h1>
<div style="margin-bottom:16px">
  <span class="tag tag-blue">所有权与借用</span>
  <span class="tag tag-green">let mut vs &amp;mut</span>
  <span class="tag tag-orange">C++ / Go 对照</span>
  <span class="tag tag-purple">重借用</span>
</div>
<p class="subtitle">本文回答：为什么「变量、引用都写了 mut」仍可能编译失败？核心心法是把引用拆成「盒子（指针）」与「目标数据」两层，<code>let</code> 后的 mut 管改指，<code>&amp;</code> 后的 mut 管改数据，由此得到 2×2 四种组合及三个常见陷阱。</p>

<div class="map">
  <h3 style="font-size:20px;color:#991b1b;margin-bottom:12px;text-align:center">两层控制权</h3>
  <div class="diagram">
    <div class="node">let [mut] r</div>
    <span class="arrow-sym">→</span>
    <div class="node-blue">盒子：地址能否改指</div>
    <span class="arrow-sym">+</span>
    <div class="node-green">&amp; [mut] T</div>
    <span class="arrow-sym">→</span>
    <div class="node">目标：数据能否修改</div>
  </div>
</div>

<div class="correction">
  <h3>认知纠偏</h3>
  <p style="color:#92400e;font-size:16px">误解：「<code>&amp;T</code> = 数据绝对不可变」。正确语义是共享引用 + 普通路径不改数据；<code>Cell</code> 等内部可变性仍可通过 <code>&amp;T</code> 修改。<code>&amp;mut</code> 的核心是独占，可变是独占的副产物。</p>
</div>

<div class="card">
  <h3>【概念拆解卡】四种可变性组合</h3>
  <p><strong>在讲什么问题：</strong>同一作用域里 <code>let r=&amp;x</code>、<code>let mut r=&amp;x</code>、<code>let r=&amp;mut x</code>、<code>let mut r=&amp;mut x</code> 各能做什么。</p>
  <p><strong>关键理解：</strong><code>r=&amp;y</code> 改盒子要 <code>let mut r</code>；<code>*r=100</code> 改数据要 <code>&amp;mut</code>。</p>
  <p><strong>典型场景：</strong>组合 1 只读借用；组合 2 链表遍历游标；组合 3 <code>fn push(v:&amp;mut Vec)</code>；组合 4 树上移动并原地写。</p>
  <p><strong>边界说明：</strong>同一时刻仅一个活跃 <code>&amp;mut</code>；演示多种组合请分 <code>{}</code> 块避免借用冲突。</p>
  <div class="quote">开头思考题：<code>let mut p=&amp;a; *p=10;</code> 失败在「共享引用不能改数据」，修复为 <code>let mut p=&amp;mut a</code>。</div>
</div>

<div class="card">
  <h3>【跨概念对比表】C++、Go、Rust</h3>
  <table>
    <tr><th>需求</th><th>C++</th><th>Go</th><th>Rust</th></tr>
    <tr><td>双锁</td><td><code>const T* const</code></td><td>无法表达</td><td><code>let r=&amp;x</code></td></tr>
    <tr><td>游标只读</td><td><code>const T*</code></td><td>无法表达</td><td><code>let mut r=&amp;x</code></td></tr>
    <tr><td>固定指针改数据</td><td><code>T* const</code></td><td>无法表达</td><td><code>let r=&amp;mut x</code></td></tr>
    <tr><td>全放开</td><td><code>T*</code></td><td><code>p:=&amp;x</code> 仅此一种</td><td><code>let mut r=&amp;mut x</code> + 借用检查</td></tr>
  </table>
</div>

<div class="card">
  <h3>【避坑清单卡】三个进阶陷阱</h3>
  <p><strong>内部可变性：</strong><code>Cell::set</code> 经 <code>&amp;T</code> 仍可改。解法：把「独占」与「可变」分开理解。严重程度：小心。</p>
  <p><strong>&amp;mut 非 Copy：</strong>传函数时可能移动；参数位常自动重借用为 <code>&amp;mut *r</code>。解法：闭包/泛型若报 moved value，检查是否未重借用。严重程度：小心。</p>
  <p><strong>参数 mut：</strong><code>mut v: &amp;mut T</code> 中参数前 mut 管改指、类型 &amp;mut 管改数据。严重程度：可忽略（读懂即可）。</p>
</div>

<div class="card">
  <h3>【决策/选型表】日常怎么选组合</h3>
  <table>
    <tr><th>场景</th><th>推荐</th><th>理由</th><th>不推荐</th><th>为什么</th></tr>
    <tr><td>只读一次</td><td>组合 1</td><td>最小权限</td><td>无谓 <code>let mut r</code></td><td>扩大可改指范围</td></tr>
    <tr><td>遍历结构</td><td>组合 2</td><td>游标移动、数据只读</td><td>组合 4</td><td>易触发 &amp;mut 独占冲突</td></tr>
    <tr><td>改单一对象</td><td>组合 3</td><td>经典可变借用</td><td>多个 &amp;mut 并存</td><td>编译器拒绝</td></tr>
    <tr><td>算法原地+移动</td><td>组合 4</td><td>唯一需要双 mut</td><td>默认就用组合 4</td><td>推理成本最高</td></tr>
  </table>
</div>

<div class="card">
  <h3>【心法/原则卡】默认最小 mut</h3>
  <p><strong>原则：</strong>优先组合 1 与 3；看到 <code>mut r:&amp;...</code> 先问是否只需组合 2。</p>
  <p><strong>怎么落地：</strong>写引用前口头拆两层：这行是改指还是改数据？再对照表选组合。</p>
  <p><strong>适用边界：</strong>本文是值类型引用基础；<code>RefCell</code>/<code>Mutex</code> 在「独占语义」之上另讲。</p>
</div>

<div class="rebuttal">
  <h3>反驳</h3>
  <p class="rebuttal-role">对立视角：「像 Go 一样只要一种指针就够了」</p>
  <p class="rebuttal-text">多指针任意改指改数据更省事，但数据竞争靠自觉；Rust 用编译期独占换可推理性，前期学习成本是显式买的保险。</p>
</div>

<div class="conclusion">
  <h2>结论</h2>
  <p><strong>总结：</strong></p>
  <ol>
    <li><code>let</code> 后 mut 管指针，<code>&amp;</code> 后 mut 管数据，独立组合出四种形态。</li>
    <li>C++/Go 对照说明 Rust 把「只读指针」「独占可变」写进类型与借用规则。</li>
    <li>内部可变性、重借用、参数 mut 是实战里最容易和「四种组合」搅在一起的三点。</li>
  </ol>
  <p><strong>行动清单：</strong></p>
  <ol>
    <li>默写四种组合各一行示例，并标出能否 <code>r=&amp;y</code> / <code>*r=...</code>。</li>
    <li>用独立 <code>{}</code> 块跑通开头思考题与 <code>r1=&amp;mut x; r2=&amp;x</code> 思考题。</li>
    <li>读自己项目里 <code>&amp;mut</code> 参数，确认是否只需组合 3 而非组合 4。</li>
  </ol>
  <p><strong>关键认知转变：</strong>从「mut 越多越好」到「两层 mut 分工」——借用检查是在帮你标出谁在独占数据。</p>
</div>

    </div>
  </foreignObject>
</svg>