<h1>Hermes Agent Docker 部署实战：VPS 24/7 运行完整方案</h1>
<div style="margin-bottom:16px">
  <span class="tag tag-blue">Hermes Agent</span>
  <span class="tag tag-green">Docker 部署</span>
  <span class="tag tag-orange">VPS 运维</span>
  <span class="tag tag-purple">安全加固</span>
</div>
<p class="subtitle">本文解决的核心问题是：如何把已在本地跑通的 Hermes Agent 可靠地搬到 VPS 上 7×24 运行，涵盖容器编排、数据持久化、进程监管、反向代理与七层安全防御的完整生产路径。</p>

<div class="map">
  <h3 style="font-size:20px;color:#1e40af;margin-bottom:20px;text-align:center">部署架构关系图</h3>
  <div class="diagram">
    <div class="node">setup 向导<br/>写配置</div>
    <span class="arrow-sym">→</span>
    <div class="node-green">Docker Compose<br/>Gateway 容器</div>
    <span class="arrow-sym">→</span>
    <div class="node">~/.hermes 卷<br/>持久化状态</div>
    <span class="arrow-sym">→</span>
    <div class="node-orange">Caddy/SSH 隧道<br/>安全暴露</div>
    <span class="arrow-sym">→</span>
    <div class="node">消息平台<br/>出站长轮询</div>
  </div>
</div>

<div class="correction">
  <h3>认知纠偏</h3>
  <p style="color:#92400e;font-size:16px">常见误解：「Hermes 用 Docker = 把 Agent 装进容器」—— 实际上还有第二种模式：Agent 在宿主机跑，Docker 仅作终端沙箱（terminal.backend: docker），二者可叠加实现双层隔离。</p>
</div>

<div class="card">
  <h3>【模板 B】最简可运行部署流程</h3>
  <p><strong>核心思路：</strong>setup 一次性写配置，compose 常驻运行 Gateway；Hermes 本身很轻（&lt;500MB），重活在远端 API。</p>
  <p><strong>操作步骤：</strong></p>
  <p>1. mkdir -p ~/.hermes</p>
  <p>2. docker run -it --rm -v ~/.hermes:/opt/data nousresearch/hermes-agent setup（交互配 API Key 与消息平台）</p>
  <p>3. docker compose up -d（restart: unless-stopped + 健康检查）</p>
  <p>4. docker exec hermes hermes doctor 验证</p>
  <p><strong>选型条件：</strong>个人 24/7 Agent、月预算 $7-10（$5 VPS + $2-5 API）。</p>
  <p><strong>对比相邻方案：</strong>比裸 systemd 安装多一层隔离与升级便利；比 K8s 轻量得多，适合单机。</p>
  <div class="highlight"><strong>生产级增强：</strong>端口绑 127.0.0.1、Named Volume 替代 bind mount、加 Watchtower 自动更新、healthcheck 每 30s 探 /health。</div>
</div>

<div class="card">
  <h3>【模板 B】数据持久化：/opt/data 是唯一真值源</h3>
  <p><strong>在讲什么问题：</strong>容器重建后对话、记忆、技能会不会丢？</p>
  <p><strong>关键目录：</strong>.env（密钥）、config.yaml、SOUL.md、sessions/、memories/、skills/、cron/、hooks/</p>
  <p><strong>怎么落地：</strong>生产用 Named Volume（docker compose down 不带 -v 不会删数据）；定期 tar 快照或 hermes backup。</p>
  <div class="pitfall"><strong>致命坑：</strong>两个 Gateway 容器同时写同一数据目录 → session 损坏。多 Agent 用 Profile 模式，不要多容器共享卷。</div>
  <div class="relation"><strong>与 bind mount 关系：</strong>Named Volume 更安全防误删；bind mount 便于直接编辑文件，但 docker compose down -v 风险更高。</div>
</div>

<div class="card">
  <h3>【模板 D】VPS 与终端后端选型表</h3>
  <table>
    <tr><th>场景</th><th>推荐方案</th><th>核心理由</th><th>不推荐</th><th>为什么不行</th></tr>
    <tr><td>最低成本 24/7</td><td>Oracle Always Free + OpenRouter :free</td><td>4 OCPU/24GB ARM 零 VPS 费</td><td>本地笔记本常开</td><td>不稳定、无公网 IP</td></tr>
    <tr><td>最快上手</td><td>Hostinger 一键模板</td><td>10 分钟内完成 Docker+setup</td><td>手动从零搭</td><td>浪费时间在环境</td></tr>
    <tr><td>命令沙箱隔离</td><td>terminal.backend: docker</td><td>危险命令破坏限于容器</td><td>local 后端生产</td><td>无隔离，提示注入风险</td></tr>
    <tr><td>突发 GPU 任务</td><td>Modal 按秒计费</td><td>每天 &lt;2-3h 计算比 VPS 便宜</td><td>Modal 做常驻网关</td><td>冷启动+不适合长连</td></tr>
    <tr><td>需要浏览器自动化</td><td>4GB 内存 VPS</td><td>Playwright/Chromium 吃内存</td><td>1GB VPS</td><td>OOM Kill</td></tr>
  </table>
</div>

<div class="card">
  <h3>【模板 E】进程监管方式对比</h3>
  <table>
    <tr><th>维度</th><th>Docker --restart</th><th>s6-overlay（容器内）</th><th>systemd</th><th>结论</th></tr>
    <tr><td>崩溃恢复粒度</td><td>整容器重启</td><td>Gateway 秒级拉起</td><td>进程级</td><td>Docker 部署首选 s6 镜像</td></tr>
    <tr><td>多 Profile</td><td>单容器共享</td><td>每 Profile 独立监管</td><td>需多 unit</td><td>一容器多 Profile 省资源</td></tr>
    <tr><td>跨平台</td><td>是</td><td>是（镜像内置）</td><td>仅 Linux</td><td>macOS 用 launchd 有 plist 覆盖坑</td></tr>
  </table>
</div>

<div class="card">
  <h3>【模板 C】踩坑清单（精选）</h3>
  <p><strong>坑：VPS 浏览器终端破坏字符</strong> — : 变 ;、@ 被替换，静默破坏 -v 和 API Key。<strong>解法：</strong>务必 SSH。<strong>严重程度：致命。</strong></p>
  <p><strong>坑：Dashboard 绑公网无认证</strong> — fail closed 直接拒绝启动。<strong>解法：</strong>BasicAuth / OAuth / SSH 隧道。<strong>严重程度：致命。</strong></p>
  <p><strong>坑：docker compose down -v</strong> — Named Volume 被清。<strong>解法：</strong>生产永远不带 -v，定期备份。<strong>严重程度：致命。</strong></p>
  <p><strong>坑：UID/GID 不匹配</strong> — 容器内权限报错。<strong>解法：</strong>设 HERMES_UID/GID 为宿主机 id。<strong>严重程度：小心。</strong></p>
</div>

<div class="card">
  <h3>【模板 A】七层纵深防御边界</h3>
  <p><strong>在讲什么问题：</strong>Agent 能自主执行命令，提示注入可能导致真实破坏，如何分层止损？</p>
  <p><strong>七层：</strong>用户授权 → 危险命令审批 → 容器隔离 → MCP 凭据过滤 → 上下文扫描 → 跨 Session 隔离 → 输入消毒。</p>
  <p><strong>硬底线：</strong>即使 --yolo 模式也绝不执行 rm -rf /、fork bomb、mkfs、dd 覆写磁盘等。</p>
  <p><strong>边界说明：</strong>七层防御降低风险但不等于零风险；企业场景建议网关/沙箱分离（Tailscale 双 VPS）。</p>
  <div class="highlight"><strong>落地：</strong>生产禁用 GATEWAY_ALLOW_ALL_USERS；terminal.backend 设 docker；chmod 600 ~/.hermes/.env；Gateway 端口仅 127.0.0.1。</div>
</div>

<div class="card">
  <h3>【模板 D】密钥管理选型</h3>
  <table>
    <tr><th>场景</th><th>推荐</th><th>核心理由</th><th>不推荐</th><th>为什么</th></tr>
    <tr><td>单机个人</td><td>.env + chmod 600</td><td>简单足够</td><td>明文进 Git</td><td>泄露 API Key</td></tr>
    <tr><td>多机/团队</td><td>Bitwarden Secrets Manager</td><td>Web 端轮换一次全集群生效</td><td>SSH 逐台改 .env</td><td>运维成本高</td></tr>
    <tr><td>气隙环境</td><td>.env 本地注入</td><td>无法访问 BSM API</td><td>Bitwarden</td><td>网络不可达</td></tr>
  </table>
</div>

<div class="conclusion">
  <h2>结论</h2>
  <p><strong>总结：</strong></p>
  <ol>
    <li>Hermes Docker 部署核心：setup 写配置 → compose 常驻 → ~/.hermes 卷持久化一切状态</li>
    <li>生产必做：127.0.0.1 绑端口、Named Volume、healthcheck、非 root 运行、七层安全</li>
    <li>消息平台走出站连接，通常无需开放入站端口</li>
    <li>终端后端 docker 提供命令沙箱；Modal 适合突发计算，VPS 适合常驻网关</li>
    <li>一容器多 Profile（s6 监管）比多容器更省资源，除非需硬隔离</li>
  </ol>
  <p style="margin-top:20px;opacity:0.95"><strong>行动清单：</strong></p>
  <ol>
    <li>SSH 连 VPS，curl get.docker.com 装 Docker，跑 setup 向导</li>
    <li>复制生产级 compose（127.0.0.1 + Named Volume + Watchtower + healthcheck）</li>
    <li>config.yaml 设 terminal.backend: docker，chmod 600 .env</li>
    <li>Dashboard 用 SSH 隧道或 Caddy BasicAuth 暴露，禁止裸奔公网</li>
    <li>写 cron 备份脚本 + docker exec hermes hermes doctor 周检</li>
  </ol>
  <p style="margin-top:20px;opacity:0.95"><strong>关键认知转变：</strong>Hermes 是「调度管家」不是「推理引擎」—— $5 VPS 足够，真正成本在 API；部署难点在持久化、安全与进程监管，不在算力。</p>
</div>

    </div>
